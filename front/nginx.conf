# Template : l'image nginx remplace ${API_UPSTREAM} au démarrage (voir docker-compose.yml).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Redirections relatives (/overlay -> /overlay/) : sinon nginx renvoie vers le port 80 du conteneur.
  absolute_redirect off;

  # Résolution DNS à la requête (et non au démarrage) : le front démarre même si l'API est arrêtée (502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://${API_UPSTREAM};

  # Flux SSE (overlay et console) : pas de tampon, connexion longue.
  location ~ ^/api/(flux|sessions/[0-9]+/flux)$ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    add_header X-Accel-Buffering no;
  }

  # Les autres appels /api/* sont relayés vers l'API.
  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Overlay et jeu de démo : pages autonomes.
  location /overlay/ { try_files $uri $uri/ /overlay/index.html; }
  location /demo/    { try_files $uri $uri/ /demo/index.html; }

  # Fichiers versionnés par Vite : cache long.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # Console (vue-router en mode history) : toute autre route renvoie index.html.
  location / { try_files $uri $uri/ /index.html; }
}
